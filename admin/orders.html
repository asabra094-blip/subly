<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subly | Orders</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body data-page="orders">
<div id="loadingScreen">
  <div class="loader-box">
    <img src="../subly-logo.png.PNG" class="loader-logo" alt="Subly">
    <p id="loadingText">Checking admin access...</p>
  </div>
</div>
<div id="app">
  <aside class="sidebar" id="adminSidebar">
    <div class="brand">
      <img src="../subly-logo.png.PNG" class="brand-logo" alt="Subly">
      <div class="brand-sub">ADMIN CONTROL</div>
    </div>
    <nav class="nav">
      <a class="nav-btn" href="index.html">🏠 <span class="nav-text">Dashboard</span></a>
<a class="nav-btn" href="resellers.html">👥 <span class="nav-text">Resellers</span></a>
<a class="nav-btn" href="wallets.html">💰 <span class="nav-text">Wallets</span></a>
<a class="nav-btn" href="topups.html">💳 <span class="nav-text">Top-up Requests</span></a>
<a class="nav-btn active" href="orders.html">🛒 <span class="nav-text">Orders</span></a>
<a class="nav-btn" href="products.html">📦 <span class="nav-text">Products</span></a>
<a class="nav-btn" href="pricing.html">💵 <span class="nav-text">Pricing</span></a>
<a class="nav-btn" href="transactions.html">📜 <span class="nav-text">Transactions</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="admin-box">
        <div class="admin-name" id="adminName">Administrator</div>
        <div class="admin-role">Subly Admin</div>
        <button class="logout" onclick="logout()">↪ <span class="nav-text">Logout</span></button>
      </div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileMenu()"></div>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-controls="adminSidebar" aria-expanded="false" onclick="toggleMobileMenu()">☰</button>
        <div class="page-title" id="pageTitle">Orders</div>
      </div>
      <div class="status"><span class="dot"></span>System online</div>
    </header>
    <div class="content">
      <section class="page active" id="orders">
<div class="panel">

    <div class="panel-head">
      <div>
        <div class="panel-title">Orders</div>
        <div class="panel-sub">
          Manage new subscriptions, deliveries and renewals
        </div>
      </div>

      <button
        class="action"
        style="padding:10px 14px;"
        onclick="loadOrders()"
      >
        ↻ Refresh
      </button>
    </div>


    <div class="panel-body">

      <div class="order-tabs">

        <button
          class="order-tab active"
          data-order-view="subscriptions"
          onclick="switchOrderView('subscriptions')"
        >
          Subscriptions
        </button>

        <button
          class="order-tab"
          data-order-view="renewals"
          onclick="switchOrderView('renewals')"
        >
          Renewals
        </button>

      </div>


      <div
        id="subscriptionOrdersView"
        class="order-view active"
      >

        <div id="ordersList">

          <div class="empty">
            <div class="empty-icon">🛒</div>
            <div>Loading orders...</div>
          </div>

        </div>

      </div>


      <div
        id="renewalOrdersView"
        class="order-view"
      >

        <div id="renewalsList">

          <div class="empty">
            <div class="empty-icon">🔁</div>
            <div>Loading renewals...</div>
          </div>

        </div>

      </div>

    </div>

  </div>
      </section>
    </div>
  </main>
</div>

<script src="assets/admin.js"></script>
</body>
</html>
