<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Subly | العملاء</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/reseller/assets/reseller.css"><link rel="stylesheet" href="/reseller/assets/customers.css"><link rel="stylesheet" href="/reseller/assets/customers-archive.css"><link rel="stylesheet" href="/portal-readability.css"><link rel="stylesheet" href="/reseller/assets/reseller-v3.css"><link rel="stylesheet" href="/reseller/assets/locale.css"><script src="/reseller/assets/locale.js"></script></head><body data-page="customers"><div id="loadingScreen"><div class="loader"><img src="/subly-logo.png.PNG" class="loader-logo" alt="Subly"><p id="loadingText">جارٍ التحقق من صلاحية الموزّع...</p></div></div><div id="app"><aside class="sidebar" id="resellerSidebar"><div class="brand"><button class="menu-toggle" type="button" aria-label="إغلاق القائمة" onclick="closeMobileMenu()" style="position:absolute;left:6px;top:0">✕</button><img src="/subly-logo.png.PNG" class="brand-logo" alt="Subly"><div class="brand-sub">بوابة الموزّع</div></div><nav class="nav"><a class="nav-btn" href="index.html">🏠 <span class="nav-text">لوحة التحكم</span></a><a class="nav-btn active" href="customers.html">👥 <span class="nav-text">العملاء</span></a><a class="nav-btn" href="subscriptions.html">📺 <span class="nav-text">الاشتراكات</span></a><a class="nav-btn" href="orders.html">🛒 <span class="nav-text">الطلبات</span></a><a class="nav-btn" href="wallet.html">💰 <span class="nav-text">المحفظة</span></a><a class="nav-btn" href="transactions.html">📜 <span class="nav-text">المعاملات</span></a></nav><div class="sidebar-bottom"><div class="account-box"><div class="account-name" id="resellerName">الموزّع</div><div class="account-tier" id="sidebarTier">—</div><button class="logout" onclick="logout()">↪ <span class="nav-text">تسجيل الخروج
