<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08080c">
<title>Subly | Reseller Portal</title>
<link rel="icon" type="image/png" href="subly-logo.png.PNG">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#07070b;--card:#111118;--input:#18181f;--text:#fff;--muted:#92929e;--purple:#975cff;--pink:#ff3fa4;--border:rgba(255,255,255,.09)}body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(145,80,255,.25),transparent 35%),radial-gradient(circle at 100% 80%,rgba(255,60,170,.10),transparent 30%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}.page{width:100%;max-width:430px}.logoArea{text-align:center;margin-bottom:28px}.logo{width:105px;height:105px;border-radius:50%;object-fit:cover;margin-bottom:15px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 55px rgba(145,80,255,.22)}.brand{font-size:31px;font-weight:900;letter-spacing:1px}.brand span{background:linear-gradient(90deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.portal{margin-top:6px;font-size:13px;color:var(--muted)}.card{border:1px solid var(--border);border-radius:25px;background:rgba(17,17,24,.9);padding:27px;backdrop-filter:blur(20px);box-shadow:0 30px 70px rgba(0,0,0,.35)}.card h1{font-size:25px;margin-bottom:7px}.description{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:25px}.field{margin-bottom:16px}label{display:block;color:#d5d5dd;font-size:13px;font-weight:700;margin-bottom:8px}.inputWrap{position:relative}input{width:100%;height:53px;border:1px solid var(--border);border-radius:14px;background:var(--input);color:white;padding:0 15px;outline:none;font-size:15px;transition:.2s}input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(151,92,255,.11)}input::placeholder{color:#686873}.passwordInput{padding-right:65px}.showPassword{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#aaaab4;font-size:11px;font-weight:800;padding:9px;cursor:pointer}.signIn{width:100%;height:54px;border:0;border-radius:15px;margin-top:6px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 13px 35px rgba(151,92,255,.22)}.signIn:disabled{opacity:.5;cursor:default}.message{display:none;margin-top:15px;padding:12px 14px;border-radius:13px;font-size:13px;line-height:1.5}.message.error{display:block;color:#ff9cac;background:rgba(255,65,95,.09);border:1px solid rgba(255,65,95,.2)}.message.success{display:block;color:#8ce6b4;background:rgba(50,210,125,.08);border:1px solid rgba(50,210,125,.2)}.divider{height:1px;background:var(--border);margin:24px 0}.invite{text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.contact{display:inline-block;margin-top:13px;padding:11px 16px;border:1px solid var(--border);border-radius:12px;background:#18181f;color:white;text-decoration:none;font-size:13px;font-weight:800}.back{display:block;width:max-content;margin:22px auto 0;color:#858590;font-size:13px;text-decoration:none}.secure{text-align:center;color:#62626c;font-size:11px;margin-top:19px}.loader{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:500px){body{align-items:flex-start;padding-top:55px}.card{padding:23px}}
</style>
</head>
<body>
<div class="page"><div class="logoArea"><img src="subly-logo.png.PNG" class="logo" alt="Subly"><div class="brand">SUB<span>LY</span></div><div class="portal">Reseller Portal</div></div><div class="card"><h1>Welcome back 👋</h1><p class="description">Sign in using the username and password provided by Subly.</p><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div><div class="field"><label for="password">Password</label><div class="inputWrap"><input id="password" class="passwordInput" type="password" placeholder="Enter your password" autocomplete="current-password" required><button id="showPassword" class="showPassword" type="button">SHOW</button></div></div><button id="loginButton" class="signIn" type="submit">Sign In</button><div id="message" class="message" role="status" aria-live="polite"></div></form><div class="divider"></div><div class="invite">Reseller accounts are invitation-only.<br>Contact us to become a Subly reseller.<br><a class="contact" href="https://wa.me/96179372399?text=Hi%20Subly%20%F0%9F%91%8B%0AI%27m%20interested%20in%20becoming%20a%20reseller." target="_blank" rel="noopener">💬 Contact Subly</a></div></div><a href="index.html" class="back">← Back to Subly</a><div class="secure">🔒 Secure reseller access</div></div>
<script>
const SUPABASE_URL='https://ymcvuwovcrqbhuhrjerd.supabase.co';
const SUPABASE_KEY='sb_publishable_Hu2aLWbK4YjkTPevo6TRtw_dRO4BIPc';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('loginForm'),usernameInput=document.getElementById('username'),passwordInput=document.getElementById('password'),loginButton=document.getElementById('loginButton'),message=document.getElementById('message'),showPassword=document.getElementById('showPassword');
function showMessage(text,type='error'){message.className='message '+type;message.textContent=text}
function clearMessage(){message.className='message';message.textContent=''}
function loading(state){loginButton.disabled=state;loginButton.innerHTML=state?'<span class="loader"></span>Signing in...':'Sign In'}
showPassword.addEventListener('click',()=>{const hidden=passwordInput.type==='password';passwordInput.type=hidden?'text':'password';showPassword.textContent=hidden?'HIDE':'SHOW'});
async function getProfile(userId){const{data,error}=await supabaseClient.from('profiles').select('id,username,business_name,role,tier,status').eq('id',userId).single();if(error)return null;return data}
async function routeUser(user){const profile=await getProfile(user.id);if(!profile){await supabaseClient.auth.signOut();showMessage('Your Subly account could not be found. Contact support.');return false}if(profile.status!=='active'){await supabaseClient.auth.signOut();showMessage(profile.status==='suspended'?'Your account has been suspended. Contact Subly support.':'Your account has not been activated yet.');return false}if(profile.role==='admin'){showMessage('Admin access confirmed. Redirecting...','success');setTimeout(()=>location.replace('admin/index.html'),250);return true}if(profile.role==='reseller'){showMessage('Welcome back! Redirecting...','success');setTimeout(()=>location.replace('reseller/index.html'),250);return true}await supabaseClient.auth.signOut();showMessage("You don't have permission to access this portal.");return false}
form.addEventListener('submit',async e=>{e.preventDefault();clearMessage();const username=usernameInput.value.trim().toLowerCase(),password=passwordInput.value;if(!/^[a-z0-9._-]{3,30}$/.test(username)){showMessage('Invalid username.');return}loading(true);try{const{data,error}=await supabaseClient.auth.signInWithPassword({email:username+'@subly.invalid',password});if(error||!data.user){showMessage('Incorrect username or password.');return}await routeUser(data.user)}catch(err){console.error('[SUBLY] login failed',err);showMessage('Something went wrong. Please try again.')}finally{loading(false)}});
(async()=>{try{const{data}=await supabaseClient.auth.getSession();if(data?.session?.user){loading(true);await routeUser(data.session.user);loading(false)}}catch(e){console.error('[SUBLY] session check failed',e)}})();
</script>
</body></html>
